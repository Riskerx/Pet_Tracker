# --- Core ---
CONFIG_GPIO=y

# --- Bluetooth ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="RishiTracker"
CONFIG_BT_DEVICE_APPEARANCE=833

# Nordic UART Service, used by ble/data_transfer.c for chunked log dumps
CONFIG_BT_NUS=y

# --- Security / bonding ---
# Enables pairing + bond storage. The passkey-display bonding flow
# itself (verified working via nRF Connect per earlier project work)
# isn't among the five source files this RC consolidates from, so
# only the Kconfig side is wired in here - see README "Known
# Limitations".
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y

# --- Sensor (BMI270) ---
# Only exercised when app_config.h has TRACKER_SIM_MOTION set to 0.
CONFIG_SENSOR=y
CONFIG_BMI270=y

# --- Logging ---
# Over SEGGER RTT instead of the DK's USB CDC-ACM serial console - no
# COM port to find/open, works over the same J-Link connection you
# already flash through, and block mode means logs queue instead of
# dropping under load. Same settings the Tracker_X bring-up firmware
# already uses successfully.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_LOG_BACKEND_RTT_MODE_BLOCK=y

# Console/UART is redundant once RTT is the log backend - freeing it
# up also means one less thing fighting for P0.06/P0.08 if this ever
# moves from the DK to the Tracker_X board, where those pins are
# bare test points, not a console.
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
