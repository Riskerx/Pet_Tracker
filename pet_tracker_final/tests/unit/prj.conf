# Deliberately minimal: because ble/tracker_service.c and the hardware
# half of sensor/motion_sensor.c are replaced with fakes.c, this test
# needs no CONFIG_BT_*, CONFIG_SENSOR, or CONFIG_BMI270 - it's testing
# application logic, not radios or drivers.

CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1

# If your exact Zephyr version still gates the ZTEST()/ZTEST_SUITE()
# macros behind the "new" ztest API, uncomment the line below:
# CONFIG_ZTEST_NEW_API=y
