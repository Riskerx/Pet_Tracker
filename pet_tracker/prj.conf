# --- Core ---
CONFIG_GPIO=y

# --- Bluetooth ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="RishiTracker"
CONFIG_BT_DEVICE_APPEARANCE=833

# Nordic UART Service, used by ble/data_transfer.c for chunked log dumps
CONFIG_BT_NUS=y

# --- Security / bonding ---
# Enables pairing + bond storage. The passkey-display bonding flow
# itself (verified working via nRF Connect per earlier project work)
# isn't among the five source files this RC consolidates from, so
# only the Kconfig side is wired in here - see README "Known
# Limitations".
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y

# --- Sensor (BMI270) ---
# Only exercised when app_config.h has TRACKER_SIM_MOTION set to 0.
CONFIG_SENSOR=y
CONFIG_BMI270=y

# --- Logging ---
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
