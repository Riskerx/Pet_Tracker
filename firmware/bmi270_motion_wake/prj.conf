# ── Sensor: BMI270 ───────────────────────────────────────────────
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BMI270=y
 
CONFIG_BMI270_TRIGGER_OWN_THREAD=y
 
# ── Bluetooth ────────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="PetTracker"
CONFIG_BT_DEVICE_APPEARANCE=833
 
# ── GPIO (required for BMI270 INT1 pin) ─────────────────────────
CONFIG_GPIO=y
 
# ── Logging ──────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SENSOR_LOG_LEVEL_DBG=y